<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timpla · Scan test</title><style>
body{margin:0;background:#fff8ed;color:#302a26;font:16px system-ui,sans-serif}main{max-width:700px;margin:auto;padding:24px}h1{font-size:28px}button,.picker{background:#c84b35;color:white;border:0;border-radius:24px;padding:14px 20px;font:inherit;display:inline-block;cursor:pointer}.actions{display:flex;gap:10px;flex-wrap:wrap}.picker input{display:none}canvas{max-width:100%;height:auto;border-radius:16px}#status{min-height:25px;margin:18px 0}li{margin:10px 0}.secondary{background:#e5e6d3;color:#302a26}</style></head><body><main><h1>Timpla</h1><div class="actions"><label class="picker">Upload photo<input id="upload" type="file" accept="image/*"></label><label class="picker secondary">Take photo<input id="camera" type="file" accept="image/*" capture="environment"></label></div><p id="status" role="status"></p><canvas id="preview" hidden></canvas><ul id="ingredients"></ul></main><script>
const canvas=document.getElementById('preview'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),list=document.getElementById('ingredients');let controller;
async function scan(file){if(!file)return;if(file.size>5000000||!file.type.startsWith('image/')){status.textContent='Choose an image up to 5 MB.';return;}if(controller)controller.abort();const current=new AbortController();controller=current;status.textContent='Scanning…';list.replaceChildren();canvas.hidden=true;const form=new FormData();form.append('image',file);
try{const response=await fetch('/detect',{method:'POST',body:form,signal:current.signal});const data=await response.json();if(!response.ok)throw Error(data.detail||'Could not scan.');if(controller!==current)return;status.textContent=data.detections.length?'Detected ingredients':'No ingredients detected';const highest=new Map();for(const d of data.detections){if(!highest.has(d.ingredient)||d.confidence>highest.get(d.ingredient))highest.set(d.ingredient,d.confidence);}for(const [name,confidence] of highest){const li=document.createElement('li');li.textContent=name+' · '+Math.round(confidence*100)+'% confidence';list.append(li);}const bitmap=await createImageBitmap(file);if(controller!==current){bitmap.close();return;}canvas.width=data.width;canvas.height=data.height;ctx.drawImage(bitmap,0,0,data.width,data.height);bitmap.close();ctx.lineWidth=Math.max(2,data.width/300);ctx.font=Math.max(14,data.width/40)+'px system-ui';for(const d of data.detections){const[x1,y1,x2,y2]=d.bbox_xyxy;ctx.strokeStyle='#c84b35';ctx.strokeRect(x1,y1,x2-x1,y2-y1);const text=d.ingredient+' '+Math.round(d.confidence*100)+'%';const y=Math.max(24,y1);ctx.fillStyle='#fff8ed';ctx.fillRect(x1,y-24,ctx.measureText(text).width+8,28);ctx.fillStyle='#302a26';ctx.fillText(text,x1+4,y);}canvas.hidden=false;}catch(error){if(error.name!=='AbortError'&&controller===current)status.textContent=error.message||'Could not reach the scanner.';}}
document.getElementById('upload').onchange=e=>scan(e.target.files[0]);document.getElementById('camera').onchange=e=>scan(e.target.files[0]);
</script></body></html>
